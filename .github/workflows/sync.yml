name: Garmin Sync

on:
  schedule:
    - cron: "3 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install garminconnect

      - name: Garmin-Daten abrufen
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python scripts/garmin_sync.py

      - name: data.json committen
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Garmin-Daten aktualisiert"
          file_pattern: docs/data.json
